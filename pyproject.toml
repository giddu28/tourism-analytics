[project]
name = "tourism-experience-analytics"
version = "1.0.0"
description = "Tourism ratings prediction, visit-mode classification, and attraction recommendations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.0",
  "numpy>=1.24",
  "plotly>=5.0",
  "openpyxl>=3.1",
]

[tool.streamlit]
entrypoint = "src/app.py"
